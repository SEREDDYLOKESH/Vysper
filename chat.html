<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Transcription</title>
    <link href="./src/styles/common.css" rel="stylesheet" />
    <style>
      @import url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css");

      body {
        background: transparent !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .chat-container {
        width: 100%;
        height: 100vh;
        background: linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.35) 0%,
          rgba(20, 20, 20, 0.45) 100%
        );
        backdrop-filter: blur(25px);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        -webkit-app-region: drag;
      }

      .chat-header {
        padding: 14px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        -webkit-app-region: drag;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(10px);
        cursor: move;
        flex-shrink: 0;
        gap: 10px;
      }

      .header-title {
        color: rgba(255, 255, 255, 0.95);
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        pointer-events: none;
        min-width: 0;
        flex: 1;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        -webkit-app-region: no-drag;
        flex-shrink: 0;
      }

      .clear-context-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: rgba(255, 255, 255, 0.9);
        border-radius: 6px;
        padding: 5px 9px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
      }

      .clear-context-btn:hover {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.24);
      }

      .clear-context-btn:active {
        transform: translateY(1px);
      }

      .recording-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff4757;
        animation: pulse 2s infinite;
        display: none;
        box-shadow: 0 0 10px rgba(255, 71, 87, 0.6);
      }

      .audio-visualizer-container {
        display: none;
        align-items: center;
        gap: 8px;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.35);
        border-radius: 14px;
        padding: 2px 10px;
        height: 24px;
        box-sizing: border-box;
        -webkit-app-region: no-drag;
      }

      .audio-bars {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 14px;
      }

      .v-bar {
        width: 3px;
        height: 3px;
        min-height: 3px;
        max-height: 14px;
        background: #10b981;
        border-radius: 1px;
        transition: height 0.05s ease;
      }

      .audio-status-badge {
        font-size: 11px;
        color: #10b981;
        font-weight: 600;
        white-space: nowrap;
        letter-spacing: 0.2px;
      }

      .loopback-status-badge {
        font-size: 10px;
        font-weight: 600;
        white-space: nowrap;
        letter-spacing: 0.2px;
        padding: 1px 7px;
        border-radius: 999px;
        border: 1px solid transparent;
        -webkit-app-region: no-drag;
      }
      .loopback-status-badge.attached {
        color: #10b981;
        background: rgba(16, 185, 129, 0.12);
        border-color: rgba(16, 185, 129, 0.35);
      }
      .loopback-status-badge.detached {
        color: #f59e0b;
        background: rgba(245, 158, 11, 0.12);
        border-color: rgba(245, 158, 11, 0.35);
      }
      .loopback-status-badge.idle {
        color: rgba(255, 255, 255, 0.65);
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.12);
      }

      .screenshot-queue-badge {
        font-size: 10px;
        font-weight: 600;
        white-space: nowrap;
        letter-spacing: 0.2px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(96, 165, 250, 0.35);
        color: #93c5fd;
        background: rgba(59, 130, 246, 0.12);
        -webkit-app-region: no-drag;
      }

      .chat-card.answer-card .message-time {
        font-weight: 600;
        color: rgba(216, 180, 254, 0.9);
      }

      @keyframes pulse {
        0% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.1); }
        100% { opacity: 1; transform: scale(1); }
      }

      .chat-messages {
        flex: 1;
        padding: 16px 20px;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-app-region: no-drag;
        box-sizing: border-box;
      }

      .message {
        margin-bottom: 14px;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        border-left: 3px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        word-wrap: break-word;
        word-break: break-word;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .message.transcription {
        background: rgba(76, 175, 80, 0.15);
        border-left: 3px solid #4caf50;
        animation: fadeInSlide 0.15s ease-out;
        position: relative;
      }

      @keyframes fadeInSlide {
        from {
          opacity: 0;
          transform: translateX(-15px);
          background: rgba(76, 175, 80, 0.3);
        }
        to {
          opacity: 1;
          transform: translateX(0);
          background: rgba(76, 175, 80, 0.15);
        }
      }

      .message.system {
        background: rgba(33, 150, 243, 0.12);
        border-left: 3px solid #2196f3;
        font-size: 12px;
      }

      .message.error {
        background: rgba(244, 67, 54, 0.15);
        border-left: 3px solid #f44336;
      }

      .message.user {
        background: rgba(255, 152, 0, 0.12);
        border-left: 3px solid #ff9800;
      }

      .message.assistant {
        background: rgba(156, 39, 176, 0.12);
        border-left: 3px solid #9c27b0;
        display: block;
      }

      .message.assistant .message-text {
        white-space: pre-wrap;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }

      .message.assistant strong {
        font-weight: 600;
        color: rgba(255, 255, 255, 1);
      }

      .message.assistant em {
        font-style: italic;
        color: rgba(255, 255, 255, 0.9);
      }

      .message.assistant code {
        background: rgba(0, 0, 0, 0.35);
        padding: 2px 5px;
        border-radius: 3px;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 11px;
        color: #64ffda;
        display: inline;
      }

      .message.assistant pre {
        background: rgba(0, 0, 0, 0.45);
        padding: 10px 14px;
        border-radius: 6px;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 11px;
        color: #64ffda;
        overflow-x: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        margin: 8px 0;
      }

      .message.assistant pre code {
        background: transparent;
        padding: 0;
      }

      .thinking-dots {
        display: flex;
        align-items: center;
        gap: 3px;
      }

      .thinking-dots .dot {
        opacity: 0.4;
        animation: thinking 1.4s infinite ease-in-out;
        font-size: 16px;
        color: #9c27b0;
      }

      .thinking-dots .dot:nth-child(1) { animation-delay: 0s; }
      .thinking-dots .dot:nth-child(2) { animation-delay: 0.2s; }
      .thinking-dots .dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes thinking {
        0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
        40% { opacity: 1; transform: scale(1.3); }
      }

      .message.thinking {
        animation: fadeIn 0.3s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .message-time {
        color: rgba(255, 255, 255, 0.55);
        font-size: 10px;
        margin-bottom: 4px;
        font-weight: 500;
      }

      .message-text {
        color: rgba(255, 255, 255, 0.95);
        font-size: 13px;
        line-height: 1.45;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        word-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        max-width: 100%;
        display: block;
      }

      .chat-input {
        padding: 14px 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        -webkit-app-region: no-drag;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(10px);
        flex-shrink: 0;
      }

      .input-container {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        -webkit-app-region: no-drag;
        transition: border-color 0.2s;
      }

      .input-container:focus-within {
        border-color: rgba(76, 175, 80, 0.5);
        background: rgba(255, 255, 255, 0.12);
      }

      .input-field {
        flex: 1;
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.95);
        font-size: 13px;
        outline: none;
      }

      .input-field::placeholder {
        color: rgba(255, 255, 255, 0.45);
      }

      .send-button, .mic-button {
        background: rgba(255, 255, 255, 0.12);
        border: none;
        border-radius: 6px;
        padding: 7px 11px;
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        transition: all 0.2s;
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .send-button:hover, .mic-button:hover {
        background: rgba(255, 255, 255, 0.25);
        color: rgba(255, 255, 255, 1);
        transform: translateY(-1px);
      }

      .mic-button.recording {
        background: rgba(255, 71, 87, 0.85);
        color: white;
        box-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
        animation: pulse 1.5s infinite;
      }

      /* Minimalist Listening Animation */
      .listening-indicator {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(76, 175, 80, 0.25);
        padding: 6px 16px;
        z-index: 1000;
        pointer-events: none;
        flex-shrink: 0;
      }

      .listening-indicator.active {
        display: flex;
        animation: fadeIn 0.3s ease-out;
      }

      .listening-wave {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .wave-bar {
        width: 3px;
        background: #4caf50;
        border-radius: 1px;
        animation: waveAnimation 1.2s infinite ease-in-out;
      }

      .wave-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
      .wave-bar:nth-child(2) { height: 12px; animation-delay: 0.15s; }
      .wave-bar:nth-child(3) { height: 16px; animation-delay: 0.3s; }
      .wave-bar:nth-child(4) { height: 12px; animation-delay: 0.45s; }
      .wave-bar:nth-child(5) { height: 8px; animation-delay: 0.6s; }

      @keyframes waveAnimation {
        0%, 100% { transform: scaleY(0.3); opacity: 0.6; }
        50% { transform: scaleY(1); opacity: 1; }
      }

      .listening-text {
        color: rgba(255, 255, 255, 0.9);
        font-size: 11px;
        font-weight: 500;
      }

      .listening-duration {
        color: #4caf50;
        font-size: 11px;
        font-family: monospace;
        font-weight: 600;
        margin-left: 4px;
      }

      /* Interim text overlay */
      .interim-overlay {
        position: fixed;
        bottom: 75px;
        left: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(76, 175, 80, 0.4);
        border-radius: 8px;
        padding: 10px 14px;
        color: rgba(255, 255, 255, 0.95);
        font-size: 12px;
        font-style: italic;
        z-index: 999;
        pointer-events: none;
        display: none;
      }

      .interim-overlay.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="chat-container" id="chatContainer">
      <div class="chat-header">
        <div class="header-title">
          <i class="fas fa-microphone" id="headerMicIcon"></i>
          <span>Live Transcription & Chat</span>
          <div class="recording-indicator" id="recordingIndicator"></div>
          <span class="loopback-status-badge idle" id="loopbackStatusBadge" title="System audio loopback status">Loopback: Idle</span>
        </div>

        <div class="header-actions">
          <span class="screenshot-queue-badge" id="screenshotQueueBadge" title="Queued screenshots (Ctrl+Shift+S to capture, Ctrl+Enter to solve)">📸 Screenshots Queued: 0</span>
          <button class="clear-context-btn" id="clear-context-btn" title="Clear follow-up context / New topic (Ctrl+Shift+X)">
            <i class="fas fa-eraser"></i> New Topic
          </button>
          <div class="audio-visualizer-container" id="audioVisualizerContainer">
            <div class="audio-bars">
              <span class="v-bar"></span>
              <span class="v-bar"></span>
              <span class="v-bar"></span>
              <span class="v-bar"></span>
              <span class="v-bar"></span>
            </div>
            <span class="audio-status-badge" id="audioStatusBadge">Listening...</span>
          </div>
        </div>
      </div>

      <!-- Real-time Listening Indicator Banner -->
      <div class="listening-indicator" id="listeningIndicator">
        <div class="listening-wave">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <span class="listening-text" id="listeningText">Mic active - speak now</span>
        <span class="loopback-status-badge idle" id="loopbackBannerBadge" title="System audio loopback status">Loopback: Idle</span>
        <span class="listening-duration" id="listeningDuration">0s</span>
      </div>

      <!-- Interim Text Overlay -->
      <div class="interim-overlay" id="interimOverlay"></div>

      <div class="chat-messages messages-list" id="chat-messages"></div>

      <div class="chat-input">
        <div class="input-container">
          <input
            type="text"
            class="input-field"
            placeholder="Type a question or speak into microphone..."
            id="chat-input"
          />
          <button class="mic-button mic-btn" id="mic-btn" title="Toggle Microphone (Alt+R)">
            <i class="fas fa-microphone"></i>
          </button>
          <button class="send-button send-btn" id="send-btn" title="Send message (Enter)">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>

    <script src="lib/markdown.js"></script>
    <script>
      // Buffer polyfill for PCM packaging in renderer (no temp files)
      (function () {
        if (typeof window !== 'undefined' && !window.Buffer) {
          window.Buffer = {
            from: function (arr) {
              if (arr instanceof ArrayBuffer) return new Uint8Array(arr);
              if (arr && arr.buffer instanceof ArrayBuffer && !(arr instanceof Uint8Array)) return new Uint8Array(arr.buffer, arr.byteOffset || 0, arr.byteLength || arr.length);
              if (arr instanceof Uint8Array) return arr;
              return new Uint8Array(arr || 0);
            },
            concat: function (chunks) {
              var total = 0;
              for (var i = 0; i < chunks.length; i++) total += (chunks[i].byteLength || chunks[i].length || 0);
              var out = new Uint8Array(total);
              var off = 0;
              for (var j = 0; j < chunks.length; j++) {
                var c = chunks[j];
                var u8 = c instanceof Uint8Array ? c : new Uint8Array(c.buffer || c, c.byteOffset || 0, c.byteLength || c.length);
                out.set(u8, off); off += u8.length;
              }
              return out;
            }
          };
        }
      })();
    </script>
    <script src="src/ui/chat.js"></script>
    <!-- Legacy inline chat script removed: logic consolidated into src/ui/chat.js (IIFE) -->
      
  </body>
</html>
